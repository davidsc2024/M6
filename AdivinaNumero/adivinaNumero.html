<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentra el numero</title>
</head>
<body>
    <h1>Busca un numero entre 1 i 20</h1>
    <button type="button" id="reinicia" onclick="botonReinicia()">Reinicia</button>
    <p>Busca el numero!</p>
    <h2 id="interrogante">?</h2>
    <p id="textocambiar">Comienza la partida...</p>
    <input type="number" id="numerousuario" min="1" max="20">
    <button type="button" id="prueba" onclick="botonPrueba()">Prueba</button>
    
    <p>Jugadas: </p>
    <p id="jugadas">20</p>

    <p>Total puntos: </p>
    <p id="puntos">0</p>


    <!-- script js-->
    <script src="js/script.js"></script> 
</body>
</html>
